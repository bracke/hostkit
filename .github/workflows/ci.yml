name: ci

# Builds hostkit and runs its suite on Linux, macOS and Windows.
#
# A matrix is not optional for this crate: every line in it exists because the hosts
# differ, so a green Linux build says nothing at all about whether it is right.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    name: build-and-test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      ALIRE_NONINTERACTIVE: "true"
    strategy:
      fail-fast: false
      matrix:
        # An x86_64 macOS image is required: gnat_native=15.2.1 ships no
        # aarch64-darwin binary, so macos-latest (arm64) cannot resolve the pin.
        os: [ubuntu-latest, macos-15-intel, windows-latest]

    steps:
      - name: Check out hostkit
        uses: actions/checkout@v7

      - name: Set up Alire
        # v5 defaults to alr 2.1.0, whose index carries gnat_native 15.2.1.
        uses: alire-project/setup-alire@v6
        with:
          toolchain: gnat_native=15.2.1 gprbuild

      - name: Raise Alire solver timeout so slow runners get a complete solution
        # Default solver.timeout is 5 s (+10 s grace); a large graph on a slow
        # runner can time out and ship an INCOMPLETE solution, silently dropping
        # transitive crates (then gprbuild fails with "<x>.gpr not found"). Give
        # the solver room to return the complete solution it finds elsewhere.
        shell: bash
        run: alr settings --global --set solver.timeout 600

      - name: Build the library
        shell: bash
        run: |
          set -o pipefail

          #  A clean build says nothing, and until now nobody was checking
          #  that here: `alr build` exits 0 with warnings on its output, so a
          #  (style) complaint or an unused `use` clause reached the
          #  repository and stayed. It survived locally too, because an
          #  incremental build does not recompile the file that carries it --
          #  which is exactly why a fresh runner is the right place to ask.
          #
          #  This crate's own units only. `alr build` compiles the path
          #  dependencies as well, and what one of those has to say about its
          #  own sources belongs to its own repository -- not to a run that
          #  cannot fix it.
          alr -n build 2>&1 | tee "${RUNNER_TEMP:-/tmp}/build-output.txt"
          if grep -Eq "^hostkit[a-z0-9_.-]*\\.(ad[bs]|c|h):[0-9]+:[0-9]+: " \
             "${RUNNER_TEMP:-/tmp}/build-output.txt"
          then
            echo "The build said something. A clean build says nothing:"
            grep -E "^hostkit[a-z0-9_.-]*\\.(ad[bs]|c|h):[0-9]+:[0-9]+: " \
              "${RUNNER_TEMP:-/tmp}/build-output.txt"
            exit 1
          fi

      - name: Build and run the test suite
        shell: bash
        working-directory: tests
        run: |
          alr --non-interactive build
          # The binary is hostkit_tests.exe on Windows, and bash will not find it under
          # the Unix name.
          #
          # Under a timeout well inside the job's own, because a suite that hangs
          # and is killed by the job takes its output with it: the Windows job
          # twice came back "cancelled" after thirty minutes with not one test
          # line in the log, so nothing said which test was stuck. Killed here
          # instead, the step fails, the log survives, and the last test AUnit
          # printed names the one that did not finish.
          #  A watchdog written out rather than `timeout`, which macOS does
          #  not have: the suite runs in the background and is killed if it is
          #  still there after five minutes.
          if [ -f ./bin/hostkit_tests.exe ]; then
            ./bin/hostkit_tests.exe &
          else
            ./bin/hostkit_tests &
          fi

          suite=$!
          for _ in $(seq 1 300); do
            kill -0 "$suite" 2>/dev/null || break
            sleep 1
          done

          if kill -0 "$suite" 2>/dev/null; then
            echo "the suite was still running after five minutes; killing it"
            kill -9 "$suite" 2>/dev/null || true
            wait "$suite" 2>/dev/null || true
            exit 1
          fi

          wait "$suite"

  # The release checklist (tools/bin/check_all) drives the project_tools-based
  # check_hostkit checker: manifest pins, required docs, and a library+suite
  # build. Linux-only -- it validates the release gate, not per-host behaviour,
  # which the matrix above covers. hostkit is not SPARK, so no GNATprove step.
  linux-release-check:
    name: Linux release checklist
    runs-on: ubuntu-latest
    env:
      ALIRE_NONINTERACTIVE: "true"
    steps:
      - name: Check out hostkit
        uses: actions/checkout@v7
        with:
          path: hostkit
      - name: Check out sibling crates (transitive pin closure)
        uses: bracke/project_tools/.github/actions/checkout-ada-siblings@main
        with:
          root: hostkit
      - name: Set up Alire
        uses: alire-project/setup-alire@v6
        with:
          toolchain: gnat_native=15.2.1 gprbuild

      - name: Raise Alire solver timeout so slow runners get a complete solution
        # Default solver.timeout is 5 s (+10 s grace); a large graph on a slow
        # runner can time out and ship an INCOMPLETE solution, silently dropping
        # transitive crates (then gprbuild fails with "<x>.gpr not found"). Give
        # the solver room to return the complete solution it finds elsewhere.
        shell: bash
        run: alr settings --global --set solver.timeout 600

      - name: Build aggregate release checker
        working-directory: hostkit/tools
        run: alr --non-interactive build
      - name: Self-test aggregate release checker
        working-directory: hostkit
        run: tools/bin/check_all_selftest
      - name: Run aggregate release checker
        working-directory: hostkit
        run: tools/bin/check_all
